services:
  - type: web
    name: tg-osint-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TGDATA_PARQUET
        value: /opt/render/project/src/data/tgdata.parquet
      - key: BOT_TOKEN
        value: 8830055380:AAGdtxtpmRSp--Eoiph98TEa617IpFuS39s
      - key: BOT_USERNAME
        value: cloud_computings_bot
      - key: API_BRAND
        value: "@cloud_computings_bot"
      - key: MASTER_KEY
        generateValue: true
    healthCheckPath: /health
